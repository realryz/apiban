[package]
name = "apiban-api"
version = "1.0.0"
edition = "2024"
description = "HTTP API behind the apiban FiveM ban system"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
hex = "0.4"
rand = "0.10"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
