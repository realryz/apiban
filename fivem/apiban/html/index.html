<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>apiban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,wght@0,420;1,380&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="screen" class="screen" hidden>
        <div class="backdrop"></div>

        <section class="panel" role="alertdialog" aria-labelledby="title" aria-describedby="reason">
            <p class="eyebrow"><span class="dot"></span><span id="server"></span></p>
            <h1 id="title" class="display">You are <em>banned</em></h1>

            <div class="callout">
                <span class="label">Reason</span>
                <p id="reason"></p>
            </div>

            <dl class="cells">
                <div class="cell"><dt>Ban ID</dt><dd id="ban-id" class="mono"></dd></div>
                <div class="cell"><dt>Banned by</dt><dd id="banned-by"></dd></div>
                <div class="cell"><dt>Duration</dt><dd id="duration"></dd></div>
                <div class="cell"><dt>Expires</dt><dd id="expires"></dd></div>
            </dl>

            <p class="appeal" id="appeal" hidden></p>

            <footer class="foot">
                <div class="progress"><div class="bar" id="bar"></div></div>
                <p class="countdown">Disconnecting in <strong id="seconds"></strong>s</p>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
