<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>apiban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,wght@0,420;1,380&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="screen" class="screen" hidden role="alertdialog" aria-labelledby="title" aria-describedby="reason">
        <header class="site-header">
            <div class="shell">
                <span class="logo"><span class="logo-mark" aria-hidden="true">✹</span>apiban</span>
                <span class="header-meta">
                    <span id="server"></span>
                    <span class="tag mono" id="header-id"></span>
                </span>
            </div>
        </header>

        <section class="shell page">
            <p class="eyebrow rise"><span class="live-dot"></span>Access denied</p>
            <h1 id="title" class="display page-title rise">You are <em>banned</em></h1>
            <p class="lead page-lead rise" id="lead"></p>

            <div class="cells rise">
                <div class="cell">
                    <span class="eyebrow">Ban ID</span>
                    <span class="stat-value"><em id="ban-id"></em></span>
                    <span class="cell-text">Mention it when you appeal</span>
                </div>
                <div class="cell">
                    <span class="eyebrow">Duration</span>
                    <span class="stat-value" id="duration"></span>
                    <span class="cell-text" id="banned-on"></span>
                </div>
                <div class="cell">
                    <span class="eyebrow">Expires</span>
                    <span class="stat-value" id="expires"></span>
                    <span class="cell-text" id="expires-at"></span>
                </div>
            </div>

            <div class="page-section rise">
                <p class="eyebrow">Reason</p>
                <div class="callout"><p class="prose" id="reason"></p></div>
            </div>

            <div class="page-section rise" id="appeal-section" hidden>
                <p class="eyebrow">Appeal</p>
                <div class="stack">
                    <div class="list-row">
                        <span class="list-index mono">01</span>
                        <div class="list-main">
                            <strong id="appeal"></strong>
                            <span>Think this is a mistake? Open a ticket there and include your ban ID.</span>
                        </div>
                        <span class="tag mono" id="appeal-id"></span>
                    </div>
                </div>
            </div>
        </section>

        <footer class="site-footer">
            <div class="progress"><div class="bar" id="bar"></div></div>
            <div class="shell">
                <span><span class="brand-mark" aria-hidden="true">✹</span> · Protected by <b>apiban</b></span>
                <span>Disconnecting in <b id="seconds"></b>s</span>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
